[workspace]
resolver = "2"
members = [
    "rust-input-gen",
]
# `eest-witness-gen` and `reth-zisk-exex` are intentionally NOT workspace
# members: both pull reth v2.7.0 and its exact alloy/revm pins, a far larger
# dependency graph than rust-input-gen's. Excluding them gives each its own
# Cargo.lock and target/, so a reth bump never moves the input-gen CLI's
# resolution (and vice versa).
exclude = ["eest-witness-gen", "reth-zisk-exex"]
