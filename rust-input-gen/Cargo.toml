[package]
name = "rust-input-gen"
version = "0.1.0"
edition = "2021"
description = "Fetches Ethereum block data via RPC and writes a binary input file for the ZisK C++ guest."

[[bin]]
name = "input-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1.5"

# Enable once we wire real RLP decoding / typed RPC responses:
# alloy = { version = "0.3", features = ["rpc-types-eth", "consensus", "rlp"] }
